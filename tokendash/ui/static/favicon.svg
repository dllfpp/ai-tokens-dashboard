<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>DASHBOARD: AI TOKENS</title>
  <defs>
    <!-- Argilla tokens: p3 lilac tile, p0 peach, p1 blue, surface white; clay = light top-left, deeper bottom-right -->
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bba9f5"/>
      <stop offset="1" stop-color="#9580e4"/>
    </linearGradient>
    <linearGradient id="peach" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7b2a5"/>
      <stop offset="1" stop-color="#ec8572"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9dcdee"/>
      <stop offset="1" stop-color="#66acdb"/>
    </linearGradient>
    <linearGradient id="milk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4def6"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#tile)"/>
  <path d="M6 18 Q6 6 18 6 H46" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="2.5" stroke-linecap="round"/>
  <!-- three pebbles growing, like the hour, day and month readings -->
  <rect x="13" y="36" width="11" height="14" rx="5.5" fill="url(#peach)"/>
  <rect x="26.5" y="27" width="11" height="23" rx="5.5" fill="url(#blue)"/>
  <rect x="40" y="16" width="11" height="34" rx="5.5" fill="url(#milk)"/>
  <rect x="15.2" y="38.5" width="2.6" height="5" rx="1.3" fill="#ffffff" fill-opacity=".55"/>
  <rect x="28.7" y="29.5" width="2.6" height="7" rx="1.3" fill="#ffffff" fill-opacity=".55"/>
  <rect x="42.2" y="18.5" width="2.6" height="9" rx="1.3" fill="#ffffff" fill-opacity=".9"/>
</svg>
